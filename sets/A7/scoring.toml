# RAKSHA Arena scoring configuration.
#
# Every number that influences a score lives in this file. It is published
# before the event and its SHA-256 is stamped on every scorecard, so teams can
# check that the rules were not changed after submissions arrived.

[weights]                       # official weights, problem statement section 6
detection = 0.20                # multilingual PII detection & contextual intelligence
identity_resolution = 0.15      # cross-document identity resolution
privacy = 0.25                  # adversarial privacy & re-identification resistance
utility = 0.20                  # clinical utility preservation
integrity = 0.10                # data integrity & secure export
performance = 0.10              # CPU efficiency & reliability

[detection]
beta = 2.0                      # F-beta of contextual precision vs recall (recall-heavy)
type_mix = 0.5                  # recall = type_mix * macro(type) + (1 - type_mix) * macro(script)

[detection.type_weights]
AADHAAR = 1.0
ABHA_NUMBER = 1.0
ABHA_ADDRESS = 1.0
PHONE = 1.0
EMAIL = 1.0
MRN = 1.0
PAN = 1.0
INSURANCE_ID = 0.8
PATIENT_NAME = 1.0
RELATIVE_NAME = 0.8
DOB = 0.7
HOUSE = 0.6
LOCALITY = 0.6
LANDMARK = 0.5
VILLAGE = 0.5
PIN = 0.5
AADHAAR_MASKED = 0.5
CANARY = 1.0

[utility.weights]
clinical_probes = 0.35          # meds, doses, vitals, labs, diagnoses, complaints, procedures
temporal = 0.20                 # intervals between a patient's events, length of stay
generalization = 0.10           # truthful, informative age / DOB / location / PIN generalisation
statistics = 0.15               # research statistics: diagnosis mix, LOS, lab means
token_retention = 0.10          # non-PII tokens kept (over-redaction detector)
record_retention = 0.10         # records still present (over-suppression detector)

[integrity.weights]
format_validity = 0.15
schema_preservation = 0.20
fhir_validity = 0.15
pseudonym_consistency = 0.10
channel_hygiene = 0.15
quarantine_handling = 0.15
report_quality = 0.10

[privacy]
utility_coupling_threshold = 0.40   # privacy credit x min(1, utility / threshold)

[privacy.weights]
direct_exposure = 0.20
record_linkage = 0.20
profile_reidentification = 0.20
targeted_attack = 0.20
pseudonym_inversion = 0.10
cross_release = 0.10

[performance.profiles.tiny]
time_good_s = 10
time_limit_s = 120
memory_good_mb = 512
memory_limit_mb = 4096

[performance.profiles.small]
time_good_s = 15
time_limit_s = 300
memory_good_mb = 512
memory_limit_mb = 4096

[performance.profiles.medium]
time_good_s = 30
time_limit_s = 450
memory_good_mb = 512
memory_limit_mb = 4096

[performance.profiles.standard]
time_good_s = 60
time_limit_s = 900
memory_good_mb = 512
memory_limit_mb = 4096

[performance.profiles.large]
time_good_s = 180
time_limit_s = 1800
memory_good_mb = 768
memory_limit_mb = 4096

[penalties]                     # points off the 100-point total (problem statement section 6)
                                # the total is NOT floored at zero, so weak teams stay rankable
per_leaked_identifier = 1.0     # unique direct identifier / full patient name surviving anywhere
leaked_identifier_cap = 25
per_unprocessed_export = 5      # an unsupported/malformed PII file copied byte-for-byte as "sanitized"
unprocessed_cap = 20
per_canary_leak = 3             # a planted canary identity found anywhere (proof of a leak path)
canary_cap = 15
false_success = 10              # exit code 0 but report missing or inputs silently dropped
input_tampering = 5             # the submission modified its read-only input

[limits]                        # default sandbox budget
cpus = 2
memory_mb = 4096
timeout_s = 900
